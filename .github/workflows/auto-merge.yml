name: "DevSecOps & Deployment Pipeline"

on:
  push:
    branches:
      - dev-001
      - main
    paths-ignore:
      - 'CHANGELOG.md'
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - dev
      - main

jobs:
  # =========================================================================
  # SECURITY CHECKS (Runs on dev-001 push or when opening PRs to dev/main)
  # =========================================================================
  security_checks:
    name: Security & Quality Gate
    if: github.ref == 'refs/heads/dev-001' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Pulls full git history for accurate Sonar attribution

      # 1. Native GitHub CodeQL Scan (SAST)
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: 'javascript-typescript'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      # 2. SonarQube Cloud Scan (SCA + Quality + Code Smells)
      # It natively reads keys and organizations from your sonar-project.properties file
      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      # 3. Halt pipeline execution if SonarQube Cloud Quality Gate fails
      # Custom script because sonarsource/sonarqube-quality-gate-action@v1 gets 403
      # on SonarCloud's CE task API — it doesn't pass the organization parameter
      # required by SonarCloud for project-scoped tokens.
      - name: SonarQube Quality Gate Check
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        timeout-minutes: 5
        run: |
          set -euo pipefail
          metadata=".scannerwork/report-task.txt"
          ceTaskId=$(sed -n 's/^ceTaskId=\(.*\)/\1/p' "$metadata")
          dashboardUrl=$(sed -n 's/^dashboardUrl=\(.*\)/\1/p' "$metadata")
          organization=$(sed -n 's/^organization=\(.*\)/\1/p' "$metadata")
          
          echo "Polling CE task: $ceTaskId (organization: $organization)"
          
          # Poll CE task status (with organization parameter for SonarCloud)
          status="PENDING"
          endTime=$(( SECONDS + 280 ))
          while [[ "$status" == "PENDING" || "$status" == "IN_PROGRESS" ]] && [ $SECONDS -lt $endTime ]; do
            printf '.'
            sleep 5
            response=$(curl -sf --user "$SONAR_TOKEN:" "${SONAR_HOST_URL}/api/ce/task?id=${ceTaskId}&organization=${organization}" || echo '{"task":{"status":"PENDING"}}')
            status=$(echo "$response" | jq -r '.task.status')
          done
          echo ""
          
          if [[ "$status" == "PENDING" || "$status" == "IN_PROGRESS" ]]; then
            echo "::error::Polling timeout reached waiting for Sonar scan to complete"
            exit 1
          fi
          if [[ "$status" == "CANCELED" ]]; then
            echo "::error::Sonar background task was CANCELED"
            exit 1
          fi
          if [[ "$status" == "FAILED" ]]; then
            errorMsg=$(echo "$response" | jq -r '.task.errorMessage // "No error message"')
            echo "::error::Sonar background task FAILED: $errorMsg"
            exit 1
          fi
          
          analysisId=$(echo "$response" | jq -r '.task.analysisId')
          echo "Analysis ID: $analysisId"
          
          # Check quality gate status — try analysisId first, fall back to projectKey
          projectKey=$(sed -n 's/^projectKey=\(.*\)/\1/p' "$metadata")
          qgStatus=""
          
          # Attempt 1: analysisId + organization
          qgResponse=$(curl -s -w "\n%{http_code}" --user "$SONAR_TOKEN:" "${SONAR_HOST_URL}/api/qualitygates/project_status?analysisId=${analysisId}&organization=${organization}" 2>/dev/null || true)
          httpCode=$(echo "$qgResponse" | tail -1)
          qgBody=$(echo "$qgResponse" | head -n -1)
          echo "Quality gate API (analysisId): HTTP $httpCode"
          
          if [[ "$httpCode" == "200" ]]; then
            qgStatus=$(echo "$qgBody" | jq -r '.projectStatus.status')
          else
            # Attempt 2: projectKey + organization (no analysisId)
            qgResponse=$(curl -s -w "\n%{http_code}" --user "$SONAR_TOKEN:" "${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=${projectKey}&organization=${organization}" 2>/dev/null || true)
            httpCode=$(echo "$qgResponse" | tail -1)
            qgBody=$(echo "$qgResponse" | head -n -1)
            echo "Quality gate API (projectKey): HTTP $httpCode"
            if [[ "$httpCode" == "200" ]]; then
              qgStatus=$(echo "$qgBody" | jq -r '.projectStatus.status')
            fi
          fi
          
          echo "Quality Gate status: $qgStatus"
          echo "Dashboard: $dashboardUrl"
          
          if [[ -z "$qgStatus" || "$qgStatus" == "null" ]]; then
            echo "::error::Could not retrieve Quality Gate status (HTTP $httpCode). Check SONAR_TOKEN has Browse permission on the project."
            exit 1
          fi
          
          if [[ "$qgStatus" == "OK" ]]; then
            echo "::notice::Quality Gate PASSED"
          elif [[ "$qgStatus" == "WARN" ]]; then
            echo "::warning::Quality Gate has WARNINGS"
          elif [[ "$qgStatus" == "ERROR" ]]; then
            echo "::error::Quality Gate FAILED"
            exit 1
          else
            echo "::error::Quality Gate not configured for this project"
            exit 1
          fi

  # =========================================================================
  # DEPLOY TO GITHUB PAGES (Runs on push to main; gate enforced at PR time)
  # =========================================================================
  deploy_pages:
    name: Deploy React+Vite to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
